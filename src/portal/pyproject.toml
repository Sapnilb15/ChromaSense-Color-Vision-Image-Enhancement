[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chromasense"
version = "1.0.0"
description = "ChromaSense web portal"
requires-python = ">=3.11"
dependencies = [
    "color_engine",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "jinja2",
]

[project.optional-dependencies]
test = [
    "pytest",
    "httpx",
    "playwright",
    "axe-playwright-python",
    "ruff",
    "import-linter",
]

[tool.setuptools.packages.find]
include = ["chromasense*"]

[tool.setuptools.package-data]
chromasense = ["web_ui/**/*"]
